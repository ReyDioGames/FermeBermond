<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lettre Ouverte</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #4CAF50;          /* fond vert ferme */
      color: white;                       /* texte blanc pour contraster */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 30px 0 20px 0;
      font-size: 2.2rem;
      text-align: center;
      text-shadow: 0 2px 6px rgba(0,0,0,0.3); /* léger effet pour lisibilité */
    }

    .pdf-container {
      width: 100%;
      max-width: 1100px;                   /* un peu plus large que 1000px */
      margin: 0 auto 40px auto;
      padding: 0 15px;
      box-sizing: border-box;
    }

    iframe {
      width: 100%;
      height: 85vh;                        /* un peu moins haut pour laisser de la marge */
      border: none;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      background-color: white;             /* fond blanc derrière le pdf au cas où */
    }

    /* Pour petits écrans (mobile) */
    @media (max-width: 768px) {
      h1 {
        font-size: 1.8rem;
        margin: 20px 0 15px 0;
      }
      iframe {
        height: 80vh;
      }
    }
  </style>
</head>
<body>

  <h1>Lettre Ouverte</h1>

  <div class="pdf-container">
    <iframe 
      src="LETTRE OUVERTE AUX CANDIDATES ET CANDIDATS AUX ÉLECTIONS MUNICIPALES DE NICE des 15 et 22 MARS 2026.pdf"
      title="Lettre Ouverte aux candidates et candidats aux élections municipales de Nice 2026">
    </iframe>
  </div>


</body>
</html>
